# Conda environment for the JMDST reproduction.
#
#   conda env create -f environment.yml
#   conda activate jmdst
#
# Versions below are the ones the reported results were produced with
# (RTX 4070 Laptop, CUDA 12.8). Recreate with these before comparing numbers.
#
# CUDA MATTERS. PyPI's default `torch` is a CPU build; on CPU the pipeline runs
# far below real time and the live demo is unusable. The `+cu128` local version
# specifiers below only exist on PyTorch's own index, so the extra-index-url is
# what makes pip resolve the GPU build rather than silently taking the CPU one.
# Verify after install with `python scripts/preflight.py`.

name: jmdst

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - ultralytics==8.4.104
      - numpy==2.4.4
      - scipy==1.17.1
      - pandas==3.0.3
      - pillow==12.2.0
      - opencv-python==5.0.0.*
      - motmetrics==1.4.0
      - pyyaml==6.0.3
      - tqdm==4.69.0
      - matplotlib
      - psutil==7.2.2

# Notes:
# - psutil is used directly by the edge/ground simulation (CPU measurement,
#   core pinning) and by preflight. Ultralytics also pulls it in, but the
#   simulation should not depend on that by accident.
# - pillow is pinned for a second reason: the modelled ground station's cache
#   is keyed by the edge's JPEG bytes, so a different Pillow (or libjpeg) build
#   can turn every lookup into a miss. Misses fall back to live YOLO and are
#   counted, so check `cache misses` in the ground's summary on a new machine.
# - Everything is installed via pip rather than mixing conda and pip packages,
#   which is what previously let a CPU torch shadow the CUDA one.
# - motmetrics 1.4 predates NumPy 2 and calls np.asfarray; jmdst/eval/metrics.py
#   installs a shim before importing it. Do not "fix" that by downgrading NumPy.
# - mamba-ssm is intentionally absent: Phase 6 (MSFP) is not implemented, and
#   its PyPI sdist ships without the CUDA sources its own setup.py requires.
