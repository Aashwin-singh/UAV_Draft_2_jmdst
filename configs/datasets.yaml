# Dataset preparation config for the JMDST reproduction.
#
# The scripts do not require PyYAML; this file records the intended paths and
# defaults for repeatable runs.

unified_root: data/unified

classes:
  names: [car, van, truck, bus]
  collapse_to_vehicle: false

visdrone:
  source_root: /path/to/VisDrone
  splits:
    train: VisDrone2019-MOT-train
    val: VisDrone2019-MOT-val
    test: VisDrone2019-MOT-test-dev
  source_class_ids:
    car: 4
    van: 5
    truck: 6
    bus: 9

uavdt:
  source_root: /path/to/UAVDT
  paper_default_car_only: true
  source_class_ids:
    car: 1
    truck: 2
    bus: 3

ssi_crop:
  output_size: 64
  grid_size: 2
  anchor_size: 32
  context_width_weight: 1.3
  context_height_weight: 0.3
  random_shift_px_train: 16
  asymmetric_ratio_threshold: 2.5
  asymmetric_policy: paper_min
